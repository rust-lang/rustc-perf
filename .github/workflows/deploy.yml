name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:     
  contents: read

env:
  AWS_ACCESS_KEY_ID: AKIA46X5W6CZBLO3VBND

concurrency: deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Export the image to Docker to make it available in the next step
          load: true
          tags: rustc-perf
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production
        uses: rust-lang/simpleinfra/github-actions/upload-docker-image@8a84f3f40d2cf82dbea7dd67d027ded23a008521 # master
        with:
          image: rustc-perf
          repository: rust-rustc-perf
          region: us-west-1
          redeploy_ecs_cluster: rust-ecs-prod
          redeploy_ecs_service: rustc-perf
          aws_access_key_id: "${{ env.AWS_ACCESS_KEY_ID }}"
          aws_secret_access_key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
